# Скелет Фазы 0. Kitsu добавляется на Фазе 2.
services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on: [api, web]

  api:
    build: ./api
    env_file: .env
    depends_on: [db, redis, minio]
    ports: ["8000:8000"]

  worker:
    build: ./api
    command: celery -A app.worker.celery_app worker -l info
    env_file: .env
    depends_on: [redis, db, api]

  web:
    build: ./web
    ports: ["5173:5173"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]

  redis:
    image: redis:7

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports: ["9000:9000", "9001:9001"]

volumes:
  caddy-data:
  pgdata:
  minio-data:
